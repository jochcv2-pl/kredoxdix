# =============================================================================
# Kredix — Docker Compose (production / VPS)
# Override / stack complète de production.
#
# Usage :
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Pré-requis :
#   - Fichier .env à la racine (POSTGRES_PASSWORD, DATABASE_URL, NEXT_PUBLIC_*).
#   - Caddyfile configuré avec le domaine réel (remplacer kredix.local).
#   - Ports 80/443 ouverts sur le VPS pour Let's Encrypt.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # migrator — One-shot : applique les migrations Prisma au démarrage.
  # Doit terminer (exit 0) AVANT que web démarre (depends_on service_completed_successfully).
  # ---------------------------------------------------------------------------
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: kredix-migrator
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - kredix-network

  # ---------------------------------------------------------------------------
  # web — Application Next.js (apps/web) buildée depuis le Dockerfile racine.
  # Le build standalone (output: 'standalone') tourne via `node server.js`.
  # Démarre APRÈS le migrator (migrations appliquées).
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: kredix-web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      WEBHOOK_EMAIL_SECRET: ${WEBHOOK_EMAIL_SECRET}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-${NEXT_PUBLIC_APP_URL}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - kredix-network

  # ---------------------------------------------------------------------------
  # admin — CRM (apps/admin) buildée depuis Dockerfile.admin.
  # Contient : routes /api/cron/*, /api/webhooks/*, /api/admin/*, /api/clients/*, etc.
  # Port interne 3001, exposé uniquement via Caddy (admin.kredix.fr).
  # ---------------------------------------------------------------------------
  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_ADMIN_URL:-https://crm.kredix.fr}
    container_name: kredix-admin
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_ADMIN_URL:-https://crm.kredix.fr}
      AUTH_SECRET: ${AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      WEBHOOK_EMAIL_SECRET: ${WEBHOOK_EMAIL_SECRET}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-${NEXT_PUBLIC_APP_URL}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - kredix-network

  # ---------------------------------------------------------------------------
  # tools — Image d'opérations (seed, scripts runtime, migrate-encryption-key).
  # Ne démarre pas automatiquement. Utilisation :
  #   docker compose -f docker-compose.prod.yml run --rm tools pnpm db:seed
  #   docker compose -f docker-compose.prod.yml run --rm tools tsx scripts/migrate-encryption-key.ts
  # ---------------------------------------------------------------------------
  tools:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    container_name: kredix-tools
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    profiles: ["tools"]
    networks:
      - kredix-network

  # ---------------------------------------------------------------------------
  # postgres — Base de données (mot de passe depuis .env, jamais hardcodé).
  # ---------------------------------------------------------------------------
  postgres:
    # En production, pinner l'image par digest (@sha256:...) pour la reproductibilité.
    # Récupérer le digest : docker image inspect postgres:17-alpine --format '{{.Id}}'
    image: postgres:17-alpine
    container_name: kredix-postgres
    restart: unless-stopped
    # Pas de port exposé en prod : accessible uniquement via le réseau interne.
    # Pour maintenance : exécuter un shell dans le conteneur ou tunnel SSH.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kredix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kredix}
    volumes:
      - kredix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kredix} -d ${POSTGRES_DB:-kredix}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kredix-network

  # ---------------------------------------------------------------------------
  # caddy — Reverse proxy + HTTPS automatique (Let's Encrypt).
  # Sert le Caddyfile et stocke les certificats dans le volume caddy_data.
  # ---------------------------------------------------------------------------
  caddy:
    # En production, pinner l'image par digest (@sha256:...) pour la reproductibilité.
    image: caddy:2-alpine
    container_name: kredix-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Domaines passés au Caddyfile via {$DOMAIN} et {$ADMIN_DOMAIN}.
      # En prod : DOMAIN=kredix.fr, ADMIN_DOMAIN=crm.kredix.fr
      DOMAIN: ${DOMAIN:-kredix.local}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.kredix.local}
      ACME_EMAIL: ${ACME_EMAIL}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
    networks:
      - kredix-network

  # ---------------------------------------------------------------------------
  # backup — Sidecar pg_dump avec rotation 3-2-1 (DEC-005).
  # Tourne en boucle (sleep), exécute pg_dump toutes les 6h par défaut.
  # Stocke les backups dans le volume kredix_backups (daily + weekly).
  # Offsite optionnel : configurer RCLONE_REMOTE pour pousser vers S3/B2.
  # ---------------------------------------------------------------------------
  backup:
    image: postgres:17-alpine
    container_name: kredix-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-kredix}
      POSTGRES_DB: ${POSTGRES_DB:-kredix}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      BACKUP_RETENTION_DAILY: ${BACKUP_RETENTION_DAILY:-7}
      BACKUP_RETENTION_WEEKLY: ${BACKUP_RETENTION_WEEKLY:-4}
      # Offsite (optionnel) : RCLONE_REMOTE=mon-s3:kredix-backups
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
    volumes:
      - ./scripts/backup-db.sh:/backup-db.sh:ro
      - kredix_backups:/backups
    entrypoint: ["/bin/sh", "/backup-db.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kredix-network

# =============================================================================
# Volumes persistants
# =============================================================================
volumes:
  kredix_pgdata:
    name: kredix_pgdata
  kredix_backups:
    name: kredix_backups
  caddy_data:
    name: kredix_caddy_data
  caddy_config:
    name: kredix_caddy_config

# =============================================================================
# Réseau bridge partagé entre les services
# =============================================================================
networks:
  kredix-network:
    name: kredix-network
    driver: bridge
