# =============================================================================
# Kredix — Configuration Nginx (reverse proxy)
# =============================================================================
# VPS : Nginx tourne dans le conteneur Docker "domip-nginx".
# Les conteneurs Kredix (web + admin) sont sur le réseau "kredix-network".
#
# Pré-requis AVANT d'activer cette config :
#   1. Connecter domip-nginx au réseau kredix-network :
#      docker network connect kredix-network domip-nginx
#
#   2. Copier ce fichier dans le dossier des confs Nginx du VPS :
#      cp nginx-kredix.conf ~/projets/<projet-nginx>/nginx/conf.d/kredix.conf
#
#   3. Tester + recharger :
#      docker exec domip-nginx nginx -t
#      docker exec domip-nginx nginx -s reload
#
#   4. Générer les certificats SSL (voir section certbot plus bas)
# =============================================================================

# -----------------------------------------------------------------------------
# Site public Kredix — kredix.fr
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name kredix.fr;

    # Certbot : challenge Let's Encrypt (HTTP-01, doit répondre en HTTP).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirection HTTP → HTTPS (DÉCOMMENTER après certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://kredix-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Cache des assets statiques Next.js
    location /_next/static/ {
        proxy_pass http://kredix-web:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable";
    }

    # Body size pour uploads (CMS, documents)
    client_max_body_size 25M;
}

# -----------------------------------------------------------------------------
# CRM Admin Kredix — crm.kredix.fr
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name crm.kredix.fr;

    # Certbot : challenge Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirection HTTP → HTTPS (DÉCOMMENTER après certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://kredix-admin:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Body size pour uploads (CMS images, PDF documents)
    client_max_body_size 25M;
}

# =============================================================================
# CERTBOT — À exécuter APRÈS que les domaines répondent en HTTP :
#
#   docker run --rm \
#     -v <chemin-certbot-etc>:/etc/letsencrypt \
#     -v <chemin-certbot-web>:/var/www/certbot \
#     certbot/certbot certonly --webroot \
#     -w /var/www/certbot \
#     -d kredix.fr -d crm.kredix.fr \
#     --email admin@kredix.fr --agree-tos --no-eff-email
#
# Puis ajouter les blocks HTTPS (ci-dessous, à décommenter) et recharger Nginx.
# =============================================================================

