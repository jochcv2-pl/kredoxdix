# =============================================================================
# Kredix — Configuration Nginx (reverse proxy)
# =============================================================================
# À placer dans /etc/nginx/sites-available/ puis symlink dans sites-enabled/.
#
# Installation :
#   sudo cp nginx-kredix-web.conf /etc/nginx/sites-available/kredix-web
#   sudo cp nginx-kredix-admin.conf /etc/nginx/sites-available/kredix-admin
#   sudo ln -s /etc/nginx/sites-available/kredix-web /etc/nginx/sites-enabled/
#   sudo ln -s /etc/nginx/sites-available/kredix-admin /etc/nginx/sites-enabled/
#   sudo nginx -t          # tester la config
#   sudo systemctl reload nginx
#   sudo certbot --nginx -d ton-domaine.fr -d crm.ton-domaine.fr  # SSL
# =============================================================================

# -----------------------------------------------------------------------------
# Site public Kredix (web) — ton-domaine.fr
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name DOMAIN_PLACEHOLDER;

    # Redirection HTTP → HTTPS (activée après certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Cache des assets statiques Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable";
    }

    # Body size pour uploads (CMS, documents)
    client_max_body_size 25M;
}

# -----------------------------------------------------------------------------
# CRM Admin Kredix — crm.ton-domaine.fr
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name ADMIN_DOMAIN_PLACEHOLDER;

    # Redirection HTTP → HTTPS (activée après certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Body size pour uploads (CMS images, PDF documents)
    client_max_body_size 25M;
}
