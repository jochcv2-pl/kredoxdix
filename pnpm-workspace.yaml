packages:
  - "apps/*"
  - "packages/*"
  - "packages/@kredix/*"

# pnpm 11.x : les build scripts sont bloqués par défaut (ERR_PNPM_IGNORED_BUILDS).
# En Docker/CI, on autorise tous (les versions sont locked dans pnpm-lock.yaml).
# En local dev, pnpm approve-builds gère l'approbation interactive.
dangerouslyAllowAllBuilds: true

# A-001 (Noveo) : pnpm 11 ne lit plus pnpm.* dans package.json — tout va ici.
# Overrides pour forcer une version unique de @types/react en monorepo (A-005).
overrides:
  "@types/react": "19.1.0"
  "@types/react-dom": "19.1.0"
